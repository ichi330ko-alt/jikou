<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="時光 個人鑑定の通常お申し込みページです。必要事項をご入力のうえ、お申し込みください。"
  >

  <title>個人鑑定 お申し込み｜時光</title>

  <meta property="og:title" content="個人鑑定 お申し込み｜時光">
  <meta property="og:description" content="時光 個人鑑定のお申し込みページです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ichi330ko-alt.github.io/jikou/personal-form.html">
  <meta property="og:image" content="https://ichi330ko-alt.github.io/jikou/img/ogp.png">
  <meta property="og:site_name" content="時光">
  <meta property="og:locale" content="ja_JP">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      --text-main: #403a43;
      --text-soft: #675f6a;
      --gold: #ad8c54;
      --paper: rgba(255,255,255,.80);
      --line: rgba(160,133,88,.30);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;
      line-height: 2;
      letter-spacing: .06em;
      background:
        radial-gradient(circle at 50% 0%, rgba(222,208,229,.42), transparent 32%),
        linear-gradient(180deg,#f7f3f5 0%,#fbf8f4 50%,#eee8ed 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(160,133,88,.2);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .header-inner {
      width: min(1120px,100%);
      min-height: 66px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: #8d7048;
      font-size: 18px;
      letter-spacing: .18em;
    }

    .header-nav {
      display: flex;
      gap: 18px;
      color: var(--text-soft);
      font-size: 13px;
    }

    .hero {
      padding: 62px 20px 52px;
      text-align: center;
    }

    .hero-symbol {
      width: min(145px,40vw);
      margin: 0 auto 20px;
    }

    .hero-symbol img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(72,50,60,.10));
    }

    .kicker {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .28em;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px,5.5vw,44px);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .12em;
      padding-left: .12em;
    }

    .hero-lead {
      max-width: 720px;
      margin: 22px auto 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 2.15;
    }

    .section {
      padding: 54px 20px 72px;
    }

    .section-inner {
      width: min(860px,100%);
      margin: 0 auto;
    }

    .section-heading {
      margin-bottom: 30px;
      text-align: center;
    }

    .section-heading small {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .26em;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(23px,4.5vw,34px);
      font-weight: 400;
      letter-spacing: .1em;
    }

    .guide-box,
    .form-shell {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 44px rgba(48,39,56,.07);
    }

    .guide-box {
      margin-bottom: 30px;
      padding: 26px 30px;
      color: var(--text-soft);
      font-size: 14px;
    }

    .guide-box p {
      margin: 0;
    }

    .guide-box p + p {
      margin-top: 12px;
    }

    .form-shell {
      overflow: hidden;
      padding: 10px;
    }

    .google-form {
      display: block;
      width: 100%;
      min-height: 2750px;
      border: 0;
      border-radius: 14px;
      background: #fff;
    }

    .back-link {
      margin-top: 26px;
      text-align: center;
    }

    .back-link a {
      color: #806c43;
      text-decoration: underline;
      text-underline-offset: 5px;
      font-size: 13px;
    }

    .site-footer {
      padding: 42px 20px;
      color: #766c76;
      background: #f1ecef;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 22px;
      margin-bottom: 18px;
    }

    .footer-links a {
      font-size: 13px;
    }

    .copyright {
      margin: 0;
      font-size: 12px;
    }

    @media(max-width:700px) {
      .header-nav {
        gap: 10px;
        font-size: 11px;
      }

      .hero {
        padding: 48px 16px 42px;
      }

      .hero-lead {
        text-align: left;
      }

      .section {
        padding: 44px 12px 60px;
      }

      .guide-box {
        padding: 22px 18px;
      }

      .google-form {
        min-height: 2850px;
      }

      .footer-links {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">時光</a>

      <nav class="header-nav" aria-label="ページ案内">
        <a href="index.html">ホーム</a>
        <a href="about.html">時光とは</a>
        <a href="analysis.html">無料解析</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-symbol">
        <img src="img/jikou-icon-bg.png" alt="時光のシンボルマーク">
      </div>

      <p class="kicker">APPLICATION FORM</p>
      <h1>個人鑑定<br>お申し込み</h1>

      <p class="hero-lead">
        無料解析を経由せず、直接個人鑑定をお申し込みになる方はこちらからご入力ください。
      </p>
    </section>

    <section class="section">
      <div class="section-inner">
        <div class="section-heading">
          <small>YOUR INFORMATION</small>
          <h2>必要事項をご入力ください</h2>
        </div>

        <div class="guide-box">
          <p>
            生年月日・出生時間・出生都道府県などは、時光解析の算定に使用します。
          </p>
          <p>
            出生時間が分からない場合は、フォーム内の案内に沿ってご入力ください。
            ご相談内容には、現在気になっていることや見てほしいことを自由にお書きください。
          </p>
        </div>

        <div class="form-shell">
          <iframe
            class="google-form"
            src="https://docs.google.com/forms/d/e/1FAIpQLSd8j81L6XNi3o71UVG_LEWTCAID18HCIxBiDf2hrd9twCC0qg/viewform?embedded=true"
            title="時光 個人鑑定お申し込みフォーム"
            loading="lazy"
          >
            読み込んでいます…
          </iframe>
        </div>

        <p class="back-link">
          <a href="personal.html">個人鑑定の説明ページへ戻る</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="contents.html">あなたに合ったコンテンツ</a>
      <a href="contact.html">お問い合わせ</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </div>

    <p class="copyright">© 2026 JIKOU</p>
  </footer>
</body>
</html>
