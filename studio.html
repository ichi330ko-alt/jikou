<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時光解析スタジオ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #2f2f2f;
      background: #f3f4f6;
      line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .studio {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .studio-header {
      margin-bottom: 24px;
    }

    .studio-header h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    .studio-header p {
      margin: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .panel {
      margin-bottom: 20px;
      padding: 22px;
      border: 1px solid #d7dbe0;
      border-radius: 12px;
      background: #fff;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .panel-description {
      margin: 0 0 18px;
      color: #68707a;
      font-size: 0.88rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label,
    legend {
      font-weight: 700;
      font-size: 0.92rem;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid #c9ced6;
      border-radius: 8px;
      background: #fff;
      padding: 11px 12px;
      color: #222;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #93a4b8;
      outline-offset: 1px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .help {
      margin: 0;
      color: #6b7280;
      font-size: 0.8rem;
    }

    .radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      padding-top: 6px;
    }

    .radio-row label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 400;
    }

    .radio-row input {
      width: auto;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .seat-box {
      min-height: 160px;
      padding: 14px;
      border: 1px solid #d7dbe0;
      border-radius: 9px;
      background: #fafafa;
    }

    .seat-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .seat-heading strong,
    .seat-heading small {
      display: block;
    }

    .seat-heading small {
      color: #747b84;
      font-size: 0.75rem;
    }

    .seat-short {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid #bfc5cd;
      border-radius: 50%;
      background: #fff;
      font-weight: 700;
    }

    .seat-main-value {
      margin: 12px 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .seat-details {
      margin: 0;
      font-size: 0.78rem;
    }

    .seat-details div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #e5e7eb;
      padding: 4px 0;
    }

    .seat-details dt,
    .seat-details dd {
      margin: 0;
    }

    .summary {
      display: grid;
      gap: 4px;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #f4f5f7;
      font-size: 0.88rem;
    }

    .tarot-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .tarot-card {
      padding: 16px;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      background: #fafafa;
    }

    .tarot-card h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .tarot-card .field + .field {
      margin-top: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-end;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .button-secondary {
      background: #e5e7eb;
      color: #222;
    }

    .button-primary {
      background: #374151;
      color: #fff;
    }

    .status {
      margin: 12px 0 0;
      min-height: 1.5em;
      color: #4b5563;
      font-size: 0.9rem;
    }

    #candidate-text {
      margin-top: 18px;
      min-height: 230px;
      background: #fbfbfc;
    }

    @media (max-width: 900px) {
      .input-grid,
      .seat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .form-grid,
      .input-grid,
      .seat-grid,
      .tarot-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="studio">
    <header class="studio-header">
      <h1>時光解析スタジオ</h1>
      <p>西洋と東洋の出生要素を選択し、12座へ自動変換します。</p>
      <p class="status" id="engine-status" aria-live="polite"></p>
    </header>

    <form id="studio-form">

      <section class="panel">
        <h2>基本情報</h2>

        <div class="form-grid">
          <div class="field">
            <label for="birth-date">生年月日</label>
            <input type="date" id="birth-date" name="birthDate" required>
          </div>

          <div class="field">
            <label for="birth-time">出生時間</label>
            <input type="time" id="birth-time" name="birthTime">
          </div>

          <div class="field">
            <label for="nickname">呼び名（ひらがな）</label>
            <input
              type="text"
              id="nickname"
              name="nickname"
              placeholder="例：そのこ"
              pattern="[ぁ-ゖー\s]*"
            >
            <p class="help">
              未入力でも解析可能です。入力した場合は名前音の加点を表示します。
            </p>
          </div>

          <fieldset class="field">
            <legend>性別</legend>
            <div class="radio-row">
              <label><input type="radio" name="gender" value="女性">女性</label>
              <label><input type="radio" name="gender" value="男性">男性</label>
              <label><input type="radio" name="gender" value="その他">その他</label>
              <label><input type="radio" name="gender" value="回答しない">回答しない</label>
            </div>
          </fieldset>
        </div>
      </section>

      <section class="panel">
        <h2>西洋出生要素</h2>
        <p class="panel-description">
          10天体をすべて選択してください。出生時間が不明な場合、ASCとMCは空欄で算定できます。
        </p>

        <div class="input-grid" id="western-grid"></div>
      </section>

      <section class="panel">
        <h2>東洋出生要素</h2>
        <p class="panel-description">
          算命学で算出した十大主星を5つ選択してください。同じ星を複数選択できます。
        </p>

        <div class="input-grid" id="eastern-grid"></div>
      </section>

      <section class="panel">
        <h2>12座の算定結果</h2>
        <p class="panel-description">
          大きな数値は西洋と東洋を50：50で統合した値です。カバラと名前音は別列で残します。
        </p>

        <div class="seat-grid" id="seat-grid"></div>

        <div class="summary">
          <span id="ranking-summary">天地統合の上位：未算定</span>
          <span id="kabbalah-summary">カバラ4秘数：未算定</span>
          <span id="katakamuna-summary">名前音：未算定</span>
        </div>

        <div class="actions" style="margin-top:18px;">
          <button
            type="button"
            class="button-secondary"
            id="calculate-seats"
            disabled
          >
            12座を算定
          </button>
        </div>

        <p class="status" id="seat-status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <h2>タロット3枚</h2>

        <div class="tarot-grid">

          <div class="tarot-card">
            <h3>現在</h3>

            <div class="field">
              <label for="tarot-current-card">カード</label>
              <select id="tarot-current-card" name="tarotCurrentCard">
                <option value="">選択してください</option>
              </select>
            </div>

            <div class="field">
              <label for="tarot-current-direction">向き</label>
              <select id="tarot-current-direction" name="tarotCurrentDirection">
                <option value="">選択してください</option>
                <option value="正位置">正位置</option>
                <option value="逆位置">逆位置</option>
              </select>
            </div>
          </div>

          <div class="tarot-card">
            <h3>課題</h3>

            <div class="field">
              <label for="tarot-challenge-card">カード</label>
              <select id="tarot-challenge-card" name="tarotChallengeCard">
                <option value="">選択してください</option>
              </select>
            </div>

            <div class="field">
              <label for="tarot-challenge-direction">向き</label>
              <select id="tarot-challenge-direction" name="tarotChallengeDirection">
                <option value="">選択してください</option>
                <option value="正位置">正位置</option>
                <option value="逆位置">逆位置</option>
              </select>
            </div>
          </div>

          <div class="tarot-card">
            <h3>鍵</h3>

            <div class="field">
              <label for="tarot-key-card">カード</label>
              <select id="tarot-key-card" name="tarotKeyCard">
                <option value="">選択してください</option>
              </select>
            </div>

            <div class="field">
              <label for="tarot-key-direction">向き</label>
              <select id="tarot-key-direction" name="tarotKeyDirection">
                <option value="">選択してください</option>
                <option value="正位置">正位置</option>
                <option value="逆位置">逆位置</option>
              </select>
            </div>
          </div>

        </div>
      </section>

      <section class="panel">
        <h2>補足メモ</h2>

        <div class="field">
          <label for="notes">メモ</label>
          <textarea
            id="notes"
            name="notes"
            placeholder="本人から聞いたこと、確認したい点、リーディングの補足など"
          ></textarea>
        </div>
      </section>

      <section class="panel">
        <div class="actions">
          <button
            type="button"
            class="button-primary"
            id="create-result"
            disabled
          >
            解析結果を作成する
          </button>
        </div>

        <p class="status" id="result-status" aria-live="polite"></p>

        <textarea
          id="candidate-text"
          aria-label="解析候補文"
          hidden
        ></textarea>
      </section>

    </form>
  </main>

  <script src="js/analysis.js"></script>
</body>
</html>
